<script>
  const videos = document.querySelectorAll('.video-card video');
  const sliderTrack = document.querySelector('.slider-track');

  videos.forEach(video => {
    let isPaused = false;

    video.addEventListener('click', () => {
      if (!isPaused) {
        // Stop slider and play video
        sliderTrack.classList.add('paused');
        video.play();
        videos.forEach(v => {
          if (v !== video) v.pause();
        });
        isPaused = true;
      } else {
        // Resume slider and pause video
        sliderTrack.classList.remove('paused');
        video.pause();
        isPaused = false;
      }
    });
  });
</script>



<script>
// Burger toggle

const burger = document.querySelector(".nav-burger");
const nav = document.querySelector(".main-nav");
burger.addEventListener("click", () => {
  nav.classList.toggle("open");
});



// Search overlay
const openBtn = document.getElementById('openSearch');
const overlay = document.getElementById('searchOverlay');
const closeSearchEls = [document.getElementById('xClose'), document.getElementById('closeSearch')];
if (openBtn && overlay){
openBtn.addEventListener('click', ()=> overlay.classList.add('show'));
closeSearchEls.forEach(el=> el && el.addEventListener('click', ()=> overlay.classList.remove('show')));
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') overlay.classList.remove('show'); });
}
</script>
<script>
  // Announcement slider
  const slides = document.querySelectorAll('.ann-slide');
  let current = 0;

  function nextSlide() {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }

  // har 3 soniyada o‘zgaradi
  setInterval(nextSlide, 3000);
</script>
